<svg xmlns="http://w3.org" viewBox="0 0 32 32">
  <style>
    :root { --bg: #0d1117; --primary: #e6edf3; --accent: #10b981; }
    @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --primary: #1f2328; --accent: #059669; } }
    .bg { fill: var(--bg); transition: fill 0.3s; }
    .code { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .arrows { stroke: var(--primary); }
    .slash { stroke: var(--accent); }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <path class="code arrows" d="M 10,11 L 5,16 L 10,21" />
  <!-- Стрелка вправо -->
  <path class="code arrows" d="M 22,11 L 27,16 L 22,21" />
  <path class="code slash" d="M 13,23 L 19,9" />
</svg>
