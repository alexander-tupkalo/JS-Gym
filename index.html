<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            var t = localStorage.getItem('jsgym-theme');
            if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <title>JS Gym — JavaScript Practice</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="preloader" id="preloader" aria-hidden="true">
        <div class="preloader-content">
            <div class="preloader-brand">
                <span class="preloader-mark">JS</span>
                <span class="preloader-text">Gym</span>
            </div>
            <p class="preloader-subtitle">JavaScript Practice</p>
        </div>
    </div>

    <header class="header">
        <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Відкрити меню">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="5" x2="17" y2="5"/>
                    <line x1="3" y1="10" x2="17" y2="10"/>
                    <line x1="3" y1="15" x2="17" y2="15"/>
                </svg>
            </button>
            <button class="logo" id="logoBtn" aria-label="На головну">
                <span class="logo-mark">JS</span>
                <span class="logo-text">Gym</span>
            </button>
            <span class="logo-subtitle">JavaScript Practice</span>
        </div>
        <div class="header-right">
            <div class="lang-switcher" role="group" aria-label="Мова інтерфейсу">
                <button class="lang-btn active" aria-pressed="true">UA</button>
                <span class="lang-separator" aria-hidden="true">|</span>
                <button class="lang-btn" aria-pressed="false">EN</button>
            </div>
            <button class="icon-btn" id="themeToggle" aria-label="Світла тема">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15.36 10.18A7 7 0 1 1 7.82 2.64 5.5 5.5 0 0 0 15.36 10.18z"/>
                </svg>
            </button>
            <button class="icon-btn user-btn" aria-label="Профіль користувача">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 15.5v-1a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v1"/>
                    <circle cx="9" cy="5.5" r="3"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <h2 class="sidebar-title">Тренування</h2>
                <nav class="sidebar-nav" id="sidebarNav" aria-label="Навігація по тренуваннях"></nav>
            </div>
        </aside>

        <div class="home-view view-hidden" id="homeView" aria-label="Головна сторінка"></div>

        <main class="main-content view-hidden" id="challengeView">
            <section class="challenge-header">
                <div class="challenge-meta">
                    <span class="category-badge" id="categoryBadge">—</span>
                    <span class="challenge-number" id="challengeNumber">#01</span>
                </div>
                <h1 class="challenge-title" id="challengeTitle">—</h1>
            </section>
            <section class="challenge-description" id="challengeDescription"></section>

            <div id="theoryContainer"></div>
            <div id="hintsContainer" class="view-hidden"></div>

            <section class="editor-section">
                <div class="editor-wrapper">
                    <div class="editor-tabs">
                        <div class="editor-tab active">
                            <span class="tab-indicator"></span>
                            <span class="tab-name">solution.js</span>
                        </div>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="lineNumbers" aria-hidden="true"></div>
                        <textarea id="codeEditor" class="editor-textarea" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Редактор коду"></textarea>
                    </div>
                </div>
            </section>
            <section class="action-buttons">
                <button class="btn btn-primary" id="runBtn" type="button">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">Запустити</span>
                </button>
                <button class="btn btn-secondary" id="checkBtn" type="button">
                    <span class="btn-icon">✓</span>
                    <span class="btn-text">Перевірити</span>
                </button>
                <button class="btn btn-secondary btn-hint" id="hintBtn" type="button">
                    <span class="btn-icon">💡</span>
                    <span class="btn-text">Підказка</span>
                </button>
            </section>
            <section class="challenge-nav">
                <button class="btn btn-nav" id="prevBtn" type="button" disabled>← Попереднє</button>
                <span class="nav-indicator" id="navIndicator">1 / 10</span>
                <button class="btn btn-nav" id="nextBtn" type="button">Наступне →</button>
            </section>
            <section class="result-panel">
                <div class="result-header">
                    <h3 class="result-title">Результат</h3>
                </div>
                <div class="result-body" id="resultBody"></div>
            </section>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
